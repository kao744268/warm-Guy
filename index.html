<!DOCTYPE html>

<html lang="zh-TW">

<head>
  <style>

.summary{

background:#fff;

border-radius:15px;

padding:15px;

margin-bottom:15px;

box-shadow:0 2px 8px #ddd;

}



.summary h3{

margin-top:0;

color:#6b3e1e;

}



.clear-btn{

width:100%;

height:55px;

border:none;

border-radius:15px;

background:#b22222;

color:white;

font-size:18px;

font-weight:bold;

margin-bottom:15px;

}


</style>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>溫暖酒場備料系統</title>


<link rel="stylesheet" href="style.css">


</head>


<body>


<div class="app">


<header>

<h1>
🍶 溫暖酒場
</h1>

<p>
備料系統
</p>

</header>



<div class="menu">


<button onclick="showPage('drink')">
🍺 酒水
</button>


<button onclick="showPage('food')">
🥩 食材
</button>


<button onclick="showPage('sauce')">
🥫 醬料
</button>


<button onclick="showPage('line')">
📋 LINE
</button>


</div>



<div class="summary">


<h3>
📊 今日備料狀態
</h3>


<div id="summaryText">

目前尚未選擇備料

</div>


</div>



<button class="clear-btn"

onclick="clearToday()">

🧹 清除今日備料

</button>
<button onclick="showPage('line')">
📋 LINE
</button>


</div>




<section id="drink" class="page">

<h2>🍺 酒水備料</h2>

<div id="drinkList"></div>

</section>





<section id="food" class="page">

<h2>🥩 食材備料</h2>

<div id="foodList"></div>

</section>





<section id="sauce" class="page">

<h2>🥫 醬料製作</h2>

<div id="sauceList"></div>

</section>





<section id="line" class="page">


<h2>📋 LINE通知</h2>


<button onclick="createLINE()">

產生備料通知

</button>



<textarea id="lineText"></textarea>



<button onclick="copyLINE()">

複製文字

</button>



</section>





</div>


<script src="data.js"></script>

<script src="app.js"></script>


</body>

</html>
