<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta 
name="viewport" 
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">


<title>
溫暖酒場｜智慧備料系統
</title>


<link rel="stylesheet" href="style.css">


<link rel="manifest" href="manifest.json">


</head>



<body>



<header>

<h1>
🍶 溫暖酒場
</h1>

<p>
智慧備料系統 V2
</p>

</header>





<nav>


<button onclick="showPage('drink')">

🍺 酒水

</button>


<button onclick="showPage('food')">

🥩 食材

</button>


<button onclick="showPage('sauce')">

🥫 醬料

</button>


<button onclick="showPage('stuff')">

🧹 雜物

</button>


<button onclick="showPage('line')">

📋 LINE

</button>



</nav>







<main>



<section id="drink">

<h2>
🍺 酒水備料
</h2>


</section>





<section id="food">

<h2>
🥩 食材備料
</h2>


</section>







<section id="sauce">

<h2>
🥫 醬料製作
</h2>


</section>







<section id="stuff">

<h2>
🧹 雜物備品
</h2>


</section>







<section id="line">


<h2>
📋 LINE通知
</h2>



<textarea

id="lineText"

placeholder="按下產生備料通知">

</textarea>



<button onclick="createLINE()">

產生備料通知

</button>



<button onclick="copyLINE()">

複製文字

</button>
  
<button onclick="resetAll()">

🔄 一鍵歸零

</button>


</section>




</main>






<script src="data.js"></script>

<script src="app.js"></script>
