<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta
name="theme-color"
content="#332a24">

<meta
name="apple-mobile-web-app-capable"
content="yes">

<meta
name="apple-mobile-web-app-status-bar-style"
content="black">

<title>
溫暖酒場｜採購管理
</title>

<link
rel="stylesheet"
href="style.css">

<link
rel="manifest"
href="manifest.json">

</head>


<body>


<header>

<div class="header-mark">
仕込み・購買
</div>

<h1>
温暖酒場
</h1>

<p>
採購管理系統 V3
</p>

</header>



<!-- =========================
     今日採購總覽
========================= -->

<div class="purchase-summary">

<div class="summary-title">
今日採購
</div>


<div class="summary-grid">


<!-- 旺來興 -->

<button
class="summary-card summary-wanlaixing"
onclick="showPage('wanlaixing')">

<span class="summary-icon">
🟥
</span>

<span class="summary-name">
旺來興
</span>

<strong
id="summary-wanlaixing">

0

</strong>

<span>
項
</span>

</button>



<!-- 全聯 -->

<button
class="summary-card summary-pxmart"
onclick="showPage('pxmart')">

<span class="summary-icon">
🟩
</span>

<span class="summary-name">
全聯
</span>

<strong
id="summary-pxmart">

0

</strong>

<span>
項
</span>

</button>



<!-- 後驛店 -->

<button
class="summary-card summary-houyi"
onclick="showPage('houyi')">

<span class="summary-icon">
🟫
</span>

<span class="summary-name">
後驛店
</span>

<strong
id="summary-houyi">

0

</strong>

<span>
項
</span>

</button>



<!-- 巨蛋店 -->

<button
class="summary-card summary-jdan"
onclick="showPage('jdan')">

<span class="summary-icon">
🟨
</span>

<span class="summary-name">
巨蛋店
</span>

<strong
id="summary-jdan">

0

</strong>

<span>
項
</span>

</button>


</div>

</div>



<!-- =========================
     導航
========================= -->

<nav>


<!-- 旺來興 -->

<button
class="nav-wanlaixing"
onclick="showPage('wanlaixing')">

<span class="nav-icon">
🛒
</span>

<span>
旺來興
</span>

</button>



<!-- 全聯 -->

<button
class="nav-pxmart"
onclick="showPage('pxmart')">

<span class="nav-icon">
🛒
</span>

<span>
全聯
</span>

</button>



<!-- 後驛店 -->

<button
class="nav-houyi"
onclick="showPage('houyi')">

<span class="nav-icon">
🛒
</span>

<span>
後驛店
</span>

</button>



<!-- 巨蛋店 -->

<button
class="nav-jdan"
onclick="showPage('jdan')">

<span class="nav-icon">
🏬
</span>

<span>
巨蛋店
</span>

</button>



<!-- 醬料 -->

<button
class="nav-sauce"
onclick="showPage('sauce')">

<span class="nav-icon">
🥣
</span>

<span>
醬料
</span>

</button>



<!-- 採購單 -->

<button
class="nav-line"
onclick="showPage('line')">

<span class="nav-icon">
📋
</span>

<span>
採購單
</span>

</button>


</nav>



<main>


<!-- =========================
     旺來興
========================= -->

<section
id="wanlaixing">
</section>



<!-- =========================
     全聯
========================= -->

<section
id="pxmart">
</section>



<!-- =========================
     後驛店
========================= -->

<section
id="houyi">
</section>



<!-- =========================
     巨蛋店
========================= -->

<section
id="jdan">
</section>



<!-- =========================
     醬料
========================= -->

<section
id="sauce">
</section>



<!-- =========================
     採購單
========================= -->

<section
id="line">


<h2>
📋 今日採購單
</h2>


<div class="line-description">

確認完各店採購數量後，
按下「產生採購單」。

</div>



<div
id="purchase-preview">

尚未產生採購單

</div>



<textarea
id="lineText"
placeholder="採購單會顯示在這裡">
</textarea>



<button
class="line-main-button"
onclick="createLINE()">

產生採購單

</button>



<button
class="line-copy-button"
onclick="copyLINE()">

複製採購單

</button>



<button
class="reset-button"
onclick="resetAll()">

🔄 一鍵歸零

</button>


</section>


</main>



<script src="data.js"></script>

<script src="app.js"></script>


</body>

</html>
