<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>溫暖備料系統</title>


<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<script src="data.js"></script>
